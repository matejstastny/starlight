name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.1.2+1.21.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install requests

      - name: Install Azalea
        uses: threeal/pipx-install-action@v1.0.0
        with:
          packages: git+https://github.com/matejstastny/azalea.git

      - name: Validate release versions
        id: validate
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python .github/scripts/validate_release.py

      - name: Resolve release tag
        id: release_tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          VERSION="${VERSION#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { if (flag) exit; if (index($0, "## [" ver "]") == 1) flag=1; next }
            flag { print }
          ' CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build dist
        run: |
          azalea export
          azalea export -c

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Starlight ${{ steps.validate.outputs.version }} for MC ${{ steps.validate.outputs.minecraft }}
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/*.mrpack
            dist/*.zip

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: kWqlGiOE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/*.mrpack

          name: Starlight ${{ steps.validate.outputs.version }} for MC ${{ steps.validate.outputs.minecraft }}
          version: ${{ steps.release_tag.outputs.tag }}
          version-type: release
          changelog: ${{ steps.changelog.outputs.notes }}

          loaders: fabric
          game-versions: ${{ steps.validate.outputs.minecraft }}
          game-version-filter: none
          fail-mode: fail
