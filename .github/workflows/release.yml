name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install requests

      - name: Install Azalea
        uses: threeal/pipx-install-action@v1.0.0
        with:
          packages: git+https://github.com/matejstastny/azalea.git

      - name: Validate release versions
        id: validate
        run: python .github/scripts/validate_release.py

      - name: Resolve release tag
        id: release_tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build mrpacks
        run: |
          azalea export
          azalea export -c

      - name: Get mrpack filenames
        id: pack
        run: |
          echo "files<<EOF" >> $GITHUB_OUTPUT
          ls dist/*.mrpack >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found packs:"
          ls dist/*.mrpack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Starlight ${{ steps.validate.outputs.version }} for MC ${{ steps.validate.outputs.minecraft }}
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            ${{ steps.pack.outputs.files }}

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: kWqlGiOE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.pack.outputs.files }}

          name: Starlight ${{ steps.validate.outputs.version }} for MC ${{ steps.validate.outputs.minecraft }}
          version: ${{ steps.release_tag.outputs.tag }}
          version-type: release
          changelog-file: CHANGELOG.md

          loaders: fabric
          game-versions: ${{ steps.validate.outputs.minecraft }}
          game-version-filter: none
          fail-mode: fail
